function pdInput(t){
  if (t.id === "pd-q"){ PD.q = t.value; const y = t.selectionStart; render(); const el = $("pd-q"); if (el){ el.focus(); el.setSelectionRange(y, y); } return true; }
  if (!PD.draft) return false;
  if (t.dataset.pdname){ PD.draft[t.dataset.pdname] = t.value; return true; }
  if (t.dataset.pdprice){ const sku = t.dataset.pdprice; PD.draft.prices[sku] = t.value; const s = PD.data.products.find(r => r.sku === sku), eff = Number(t.value) > 0 ? Number(t.value) : s.price;
    const c = document.querySelector(`[data-cust="${sku}"]`); if (c) c.textContent = eff > 0 ? baht(linePrice(eff, sku)) : "-"; return true; }
  if (t.dataset.pdcost){ PD.draft.costs[t.dataset.pdcost] = t.value; return true; }
  if (t.dataset.pdshow){ PD.draft.hidden[t.dataset.pdshow] = !t.checked; t.nextElementSibling.textContent = t.checked ? "แสดง" : "ซ่อน"; return true; }
  if (t.dataset.upkey && t.files && t.files.length && !t.dataset.busy){ t.dataset.busy = "1"; pdUpload(t.dataset.upkey, [...t.files]); return true; }
  return false;
}

/* ----- หลังบ้าน: รายงานยอดขาย + ส่งออก Excel ----- */
const RP = {from: "", to: "", preset: "7d", data: null, state: "", err: ""};
const bkkDay = (ms = Date.now()) => new Date(ms + 7 * 3600e3).toISOString().slice(0, 10);
const bkkTime = ms => ms ? new Date(ms + 7 * 3600e3).toISOString().slice(0, 16).replace("T", " ") : "";
const addDays = (day, n) => bkkDay(Date.parse(day + "T12:00:00+07:00") + n * 86400e3);
const RP_STATUS = {pending: "รอชำระเงิน", toship: "ชำระแล้ว รอจัดส่ง", shipping: "กำลังจัดส่ง", done: "สำเร็จ", cancelled: "ยกเลิก", refund: "ยกเลิก รอคืนเงิน"};
const RP_PAID = ["toship", "shipping", "done"];
function rpRange(p){
  const t = bkkDay(), m = t.slice(0, 8);
  if (p === "today") return [t, t];
  if (p === "7d") return [addDays(t, -6), t];
  if (p === "30d") return [addDays(t, -29), t];
  if (p === "month") return [m + "01", t];
  if (p === "lastmonth"){ const last = addDays(m + "01", -1); return [last.slice(0, 8) + "01", last]; }
  return [RP.from || addDays(t, -6), RP.to || t];
}
async function rpLoad(){
  if (RP.preset !== "custom") [RP.from, RP.to] = rpRange(RP.preset);
  RP.state = "loading"; RP.err = ""; if (route().page === "admin") render();
  try { RP.data = await api(`api/admin/report?from=${RP.from}&to=${RP.to}`, {method: "GET"}, await idToken()); RP.state = "ok"; }
  catch (e) { RP.state = "error"; RP.err = e.message; }
  if (route().page === "admin") render();
}
function rpCalc(orders){
  const paid = orders.filter(o => RP_PAID.includes(o.status)), pend = orders.filter(o => o.status === "pending");
  const sum = (a, f) => a.reduce((s, o) => s + (Number(f(o)) || 0), 0);
  const byStatus = Object.keys(RP_STATUS).map(k => { const l = orders.filter(o => o.status === k); return {k, label: RP_STATUS[k], n: l.length, amount: sum(l, o => o.total)}; });
  const days = new Map();
  for (let d = RP.data.from; d <= RP.data.to; d = addDays(d, 1)) days.set(d, {day: d, orders: 0, paid: 0, sales: 0});
  for (const o of orders){ const d = days.get(bkkDay(o.createdAt)); if (!d) continue; d.orders++; if (RP_PAID.includes(o.status)){ d.paid++; d.sales += o.total; } }
  const prod = new Map(); let giftCost = 0, giftQty = 0;
  for (const o of paid) for (const l of o.lines){
    const c = Number(l.cost) || 0;
    if (l.gift){ giftCost += l.qty * c; giftQty += l.qty; continue; }
    const p = prod.get(l.sku) || {sku: l.sku, title: l.title, qty: 0, sales: 0, cost: 0}; p.qty += l.qty; p.sales += l.qty * l.price; p.cost += l.qty * c; prod.set(l.sku, p);
  }
  const items = [...prod.values()].map(p => ({...p, unit: p.qty ? Math.round(p.cost / p.qty * 100) / 100 : 0, profit: p.sales - p.cost})).sort((a, b) => b.qty - a.qty || b.sales - a.sales);
  const cost = items.reduce((s, p) => s + p.cost, 0) + giftCost, net = sum(paid, o => o.total - (o.ship || 0));
  // โค้ดส่วนลด
  const codes = new Map();
  const cp = code => { if (!codes.has(code)){ const meta = (RP.data.coupons || []).find(c => c.code === code) || {}; codes.set(code, {code, title: meta.title || "", type: meta.type || "", collected: (RP.data.collects || {})[code] || 0, collectedAll: (RP.data.collectsAll || {})[code] || 0, used: 0, pending: 0, cancelled: 0, discount: 0, sales: 0}); } return codes.get(code); };
  for (const c of RP.data.coupons || []) cp(c.code);
  for (const o of orders) for (const [code, amt] of [[o.coupon, o.discount], [o.shipCoupon, o.shipDiscount]]){
    if (!code) continue; const x = cp(code);
    if (RP_PAID.includes(o.status)){ x.used++; x.discount += Number(amt) || 0; x.sales += o.total; } else if (o.status === "pending") x.pending++; else x.cancelled++;
  }
  const coupons = [...codes.values()].sort((a, b) => b.used - a.used || b.collected - a.collected);
  // โปรโมชั่น
  const pm = new Map();
  for (const o of paid) for (const p of o.promoList || []){ const x = pm.get(p.title) || {title: p.title, orders: 0, discount: 0, sales: 0}; x.orders++; x.discount += Number(p.amount) || 0; x.sales += o.total; pm.set(p.title, x); }
  return {sales: sum(paid, o => o.total), paidN: paid.length, pendN: pend.length, pendAmt: sum(pend, o => o.total), total: orders.length,
    avg: paid.length ? Math.round(sum(paid, o => o.total) / paid.length) : 0, pcs: items.reduce((s, p) => s + p.qty, 0),
    disc: sum(paid, o => o.discount + o.promoDiscount + (o.shipDiscount || 0) + (o.pointsDiscount || 0)), ship: sum(paid, o => o.ship || 0), byStatus, days: [...days.values()], items,
    cost, giftCost, giftQty, net, profit: net - cost, coupons, promos: [...pm.values()].sort((a, b) => b.orders - a.orders)};
}

const DB = {data: null, state: "", err: "", at: 0};
async function dbLoad(){
  DB.state = DB.data ? "refresh" : "loading"; if (route().page === "admin" && AD.tab === "dash") render();
  try { DB.data = await api("api/admin/dashboard", {method: "GET"}, await idToken()); DB.state = "ok"; DB.at = Date.now(); }
  catch (e) { DB.state = "error"; DB.err = e.message; }
  if (route().page === "admin" && AD.tab === "dash") render();
}
function dbCalc(){
  const o = DB.data.orders, t = bkkDay(DB.data.now), y = addDays(t, -1), m = t.slice(0, 8), lm = addDays(m + "01", -1).slice(0, 8);
  const dayOf = x => bkkDay(x.createdAt), paid = x => RP_PAID.includes(x.status);
  const stat = f => { const l = o.filter(f), p = l.filter(paid); return {n: l.length, paidN: p.length, sales: p.reduce((s, x) => s + x.total, 0)}; };
  const dom = Number(t.slice(8));
  const today = stat(x => dayOf(x) === t), yest = stat(x => dayOf(x) === y);
  const month = stat(x => dayOf(x).startsWith(m)), lastMtd = stat(x => dayOf(x).startsWith(lm) && Number(dayOf(x).slice(8)) <= dom);
  const days = []; for (let i = 13; i >= 0; i--){ const d = addDays(t, -i); const s = stat(x => dayOf(x) === d); days.push({day: d, ...s}); }
  const prod = new Map();
  for (const x of o) if (paid(x) && dayOf(x).startsWith(m)) for (const l of x.lines){ if (l.gift) continue; const p = prod.get(l.sku) || {sku: l.sku, title: l.title, qty: 0, sales: 0}; p.qty += l.qty; p.sales += l.qty * l.price; prod.set(l.sku, p); }
  const toship = o.filter(x => x.status === "toship").sort((a, b) => (a.paidAt || a.createdAt) - (b.paidAt || b.createdAt));
  const pending = o.filter(x => x.status === "pending").sort((a, b) => a.expiresAt - b.expiresAt);
  const refund = o.filter(x => x.status === "refund");
  const shipping = o.filter(x => x.status === "shipping");
  return {today, yest, month, lastMtd, days, top: [...prod.values()].sort((a, b) => b.qty - a.qty).slice(0, 5), toship, pending, refund, shipping, recent: [...o].sort((a, b) => b.createdAt - a.createdAt).slice(0, 8)};
}

const WHEEL_COL = ["#E40019", "#FFFFFF", "#1E1E22", "#FFE4E7"];
function wheelSvg(prizes){
  const n = prizes.length, R = 150, seg = 360 / n;
  const pt = (a, r) => { const t = (a - 90) * Math.PI / 180; return [160 + r * Math.cos(t), 160 + r * Math.sin(t)]; };
  const cols = i => n % 2 && i === n - 1 ? WHEEL_COL[3] : WHEEL_COL[i % 2 ? 1 : (i / 2) % 2 ? 2 : 0];
  return `<svg viewBox="0 0 320 320" class="wheel-svg" aria-hidden="true">${prizes.map((p, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), mid = a0 + seg / 2, fill = cols(i), dark = fill === "#E40019" || fill === "#1E1E22";
    const [tx, ty] = pt(mid, R * 0.62), big = p.type === "points" && /jack/i.test(p.label);
    return `<path d="M160 160L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${fill}" stroke="#1E1E22" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${mid.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="middle" fill="${dark ? "#fff" : "#1E1E22"}" font-family="Mitr,Prompt,sans-serif" font-weight="600" font-size="${big ? 11 : 13}">${esc(p.label.length > 14 ? p.label.slice(0, 13) + "…" : p.label)}</text>`; }).join("")}
    <circle cx="160" cy="160" r="${R}" fill="none" stroke="#1E1E22" stroke-width="4"/>
    ${prizes.map((p, i) => { const [x, y] = pt(i * seg, R - 2); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#fff" stroke="#1E1E22" stroke-width="1.5"/>`; }).join("")}</svg>`;
}

  if (a === "picksku"){ sel = b.dataset.v; qty = 1; return keep(); }
  if (a === "pickc" && p){ const cur = bySku.get(sel).v; const nx = p.variants.find(x => x.c === b.dataset.v && x.s === cur.s && x.stock > 0) || p.variants.find(x => x.c === b.dataset.v && x.stock > 0) || p.variants.find(x => x.c === b.dataset.v); sel = nx.sku; qty = 1; return keep(); }
  if (a === "picks" && p){ const cur = bySku.get(sel).v; const nx = p.variants.find(x => x.c === cur.c && x.s === b.dataset.v); if (nx){ sel = nx.sku; qty = 1; } return keep(); }
  if (a === "qplus"){ qty++; return keep(); }
  if (a === "qminus"){ qty--; return keep(); }
  if (a === "add" || a === "buy"){ cart.set(sel, (cart.get(sel) || 0) + qty); qty = 1; saveCart(); if (a === "buy") return go("#cart"); toast("ใส่ตะกร้าแล้ว"); return keep(); }
  if (a === "inc" || a === "dec" || a === "remove"){
    const k = a === "remove" ? 0 : (cart.get(b.dataset.sku) || 0) + (a === "inc" ? 1 : -1);
    if (k <= 0) cart.delete(b.dataset.sku); else cart.set(b.dataset.sku, k);
    saveCart(); return keep();
  }
  if (a === "checkout"){ formError = ""; go("#checkout"); return scrollTo(0, 0); }
  if (a === "order") return placeOrder();
  if (a === "copyacc") return copyText(SHOP.payment.accountNumber.replace(/[^\d]/g, ""), "คัดลอกเลขบัญชีแล้ว");
  if (a === "copyamt") return copyText(String(totals().total), "คัดลอกยอดโอนแล้ว");
  if (a === "copynum") return copyText(b.dataset.v, "คัดลอกแล้ว");
  if (a === "ordertab"){ orderTab = b.dataset.k; return keep(); }
  if (a === "reloadorders") return loadOrders();
  if (a === "cancelask") return openSheet(`<h2>ยกเลิกคำสั่งซื้อ ${esc(b.dataset.v)}</h2>
    <p>ยืนยันการยกเลิกคำสั่งซื้อนี้ใช่ไหมคะ ยกเลิกแล้วจะกู้คืนไม่ได้ ถ้าต้องการสินค้าต้องสั่งซื้อใหม่</p>
    <p class="warn" style="margin:0">ถ้าโอนเงินไปแล้ว อย่าเพิ่งกดยกเลิก ให้อัปโหลดสลิปก่อนนะคะ</p>
    <button class="btn" type="button" data-act="cancelyes" data-v="${esc(b.dataset.v)}">ยืนยันยกเลิก</button>
    <button class="btn line" type="button" data-act="closesheet">ไม่ยกเลิก</button>`);
  if (a === "cancelyes") return cancelOrder(b.dataset.v);
  if (a.startsWith("ad-")) return adminClick(a, b);
  if (memberClick(a, b) !== false) return;
  if (a === "lang") return showLangs();
  if (a === "galgo"){ const tr = $("galtrack"); if (tr) tr.scrollTo({left: Number(b.dataset.i) * tr.clientWidth, behavior: "smooth"}); return; }
  if (a === "setlang") return setLang(b.dataset.v);
  if (a === "orderopen"){ go("#order/" + encodeURIComponent(b.dataset.v)); return scrollTo(0, 0); }
  if (a === "refundask"){ const o = (orders || []).find(x => x.number === b.dataset.v); return openSheet(`<h2>ยกเลิกคำสั่งซื้อ ${esc(b.dataset.v)}</h2>
    <p>คำสั่งซื้อนี้ชำระเงินแล้ว${o ? " " + baht(o.total) : ""} กรุณากรอกบัญชีสำหรับรับเงินคืน แอดมินจะโอนคืนและแจ้งกลับในแชตค่ะ</p>
    <label class="fld">ธนาคาร / พร้อมเพย์<input id="rf-bank" placeholder="เช่น กสิกรไทย หรือ พร้อมเพย์" maxlength="60"></label>
    <label class="fld">เลขบัญชี / เลขพร้อมเพย์<input id="rf-acc" inputmode="numeric" maxlength="30"></label>
    <label class="fld">ชื่อบัญชี<input id="rf-name" maxlength="100"></label>
    <p class="warn" id="rf-err" style="margin:0" hidden></p>
    <button class="btn" type="button" data-act="refundyes" data-v="${esc(b.dataset.v)}">ยืนยันยกเลิกและขอคืนเงิน</button>
    <button class="btn line" type="button" data-act="closesheet">ไม่ยกเลิก</button>`); }
  if (a === "refundyes"){
    const refund = {bank: $("rf-bank").value.trim(), account: $("rf-acc").value.trim(), name: $("rf-name").value.trim()}, d = refund.account.replace(/\D/g, ""), err = $("rf-err");
    const msg = refund.bank.length < 2 ? "กรุณากรอกธนาคารหรือพร้อมเพย์" : d.length < 10 || d.length > 15 ? "กรุณากรอกเลขบัญชีหรือเลขพร้อมเพย์ให้ถูกต้อง (10–15 หลัก)" : refund.name.length < 2 ? "กรุณากรอกชื่อบัญชี" : "";
    if (msg){ err.textContent = msg; err.hidden = false; return; }
    return cancelOrder(b.dataset.v, refund);
  }
  if (a === "tochat"){ closeSheet(); try { if (window.liff && liff.isInClient()) return liff.closeWindow(); } catch (e) {} location.href = "https://line.me/R/ti/p/" + encodeURIComponent(CONFIG.OA_ID); return; }
  if (a === "saveaddr"){ draft.remember = true; store.set("ponpon-customer", draft); return toast("บันทึกที่อยู่แล้ว"); }
  if (a === "login"){ return liffReady.then(ok => ok ? liff.login({redirectUri: location.href}) : toast("เปิดหน้านี้จากในแอป LINE เพื่อเข้าสู่ระบบนะคะ")); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (adminInput(t)) return;
  if (t.dataset.f){ draft[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value; return; }
  if (t.dataset.pf && pf){ pf[t.dataset.pf] = t.type === "checkbox" ? t.checked : t.value; return; }
  if (t.id === "q"){ listQ = t.value; $("plist").innerHTML = productList(); }
  if (t.id === "dq"){ listQ = t.value; if (route().page !== "products"){ go("#products"); setTimeout(() => { const d = $("dq"); if (d){ d.focus(); d.setSelectionRange(d.value.length, d.value.length); } }, 0); } else if ($("plist")){ $("plist").innerHTML = productList(); const q = $("q"); if (q) q.value = listQ; } }
  if (t.id === "only"){ listOnly = t.checked; $("plist").innerHTML = productList(); }
});
document.addEventListener("change", e => { const t = e.target; if (t.id === "shp-file" && t.files && t.files[0]) return shpImport(t.files[0]); if (t.dataset && t.dataset.shp !== undefined && SHPI.rows){ shpInput(t); const i = Number(t.dataset.shp), p = byId.get(SHPI.assign[i].pid); t.style.borderColor = p ? "" : "var(--red)"; if (p && t.value.trim().toUpperCase().split(/\s+/)[0] === p.id && !t.value.includes(" ")) t.value = p.id + " " + p.title; return; } if (t.dataset && t.dataset.ly && route().page === "admin"){ lyInput(t); return keepRender(); } if (t.dataset && t.dataset.pf && pf){ pf[t.dataset.pf] = t.type === "checkbox" ? t.checked : t.value; return; } if (t.dataset && (t.dataset.e || t.dataset.upkey || t.dataset.pdshow) && adminInput(t)) return; if (t.dataset && t.dataset.slip && t.files && t.files[0]) uploadSlip(t.dataset.slip, t.files[0]); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ocard")) e.target.click(); if (e.key === "Escape") closeSheet(); if (e.key === "Enter" && e.target.id === "ly-q"){ e.preventDefault(); LY.q = e.target.value.trim(); return lyMembers(); } if (e.key === "Enter" && e.target.id === "code"){ e.preventDefault(); setCoupon(e.target.value.trim()); render(); } });
let holdSheet = false; // ให้หน้าต่างแจ้งผลสั่งซื้อค้างไว้ตอนเปลี่ยนหน้า
window.addEventListener("hashchange", () => { if (holdSheet) holdSheet = false; else closeSheet(); render(); });

/* ---------- เริ่มต้น ---------- */
/* ---------- ภาษา: ไทยเป็นค่าเริ่มต้น ภาษาอื่นแปลจาก lang.json ----------
   หน้าร้านเขียนเป็นภาษาไทย แล้วระบบจะสลับคำบนหน้าจอเป็นภาษาที่เลือก
   (ส่วนที่มี translate="no" เช่นชื่อสินค้า ชื่อและที่อยู่ลูกค้า จะไม่ถูกแปล)
   ตอนเป็นภาษาไทย ใช้ "texts" ใน shop.json เพื่อเปลี่ยนคำได้ */
const LANGS = [["th", "ไทย"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["ko", "한국어"], ["my", "မြန်မာ"], ["lo", "ລາວ"]];
const LOCALE = {th: "th-TH", en: "en-GB", zh: "zh-CN", ja: "ja-JP", ko: "ko-KR", my: "my-MM", lo: "lo-LA"};
let LANG = LANGS.some(([k]) => k === store.get("ponpon-lang", "th")) ? store.get("ponpon-lang", "th") : "th";
let LANGDATA = null, textPairs = [];
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const EDGE = "\\s\\d฿()\\[\\]·:/,.!~%+\\-–";
function setTexts(map){
  textPairs = Object.entries(map || {}).filter(([a, b]) => a && typeof b === "string" && a !== b && !a.startsWith("_"))
    .sort((x, y) => y[0].length - x[0].length)
    .map(([a, b]) => [a.length <= 6 ? new RegExp(`(^|[${EDGE}])${reEsc(a)}(?=$|[${EDGE}])`, "g") : a, b]);
  document.documentElement.lang = LANG;
  if (textPairs.length) swapTexts(document.body);
}
const applyLang = () => {
  optPairs = null;
  if (LANG === "th") return setTexts(SHOP.texts);
  const map = {...((LANGDATA && LANGDATA[LANG]) || {})};
  // ชื่อโค้ด/โปรที่แอดมินใส่ชื่อภาษาอังกฤษไว้ ใช้ชื่ออังกฤษกับทุกภาษาที่ไม่ใช่ไทย (ถ้าไม่มีคำแปลใน lang.json)
  for (const x of [...(SHOP.coupons || []), ...(SHOP.promos || [])]) if (x.title && x.titleEn && !map[x.title]) map[x.title] = x.titleEn;
  setTexts(map);
};
/* ชื่อสินค้าและตัวเลือก (สี/ไซซ์) ตามภาษาที่เลือก: ชื่ออยู่ใน lang.json > names, คำในตัวเลือกอยู่ใน options */
const tName = p => LANG === "th" ? p.title : (SHOP.names && SHOP.names[p.id] && SHOP.names[p.id].en) || (LANGDATA && LANGDATA.names && LANGDATA.names[LANG] && LANGDATA.names[LANG][p.id]) || p.title;
let optPairs = null;
function tOpt(t){
  if (LANG === "th" || !t || !LANGDATA || !LANGDATA.options) return t;
  if (!optPairs) optPairs = Object.entries(LANGDATA.options[LANG] || {}).sort((a, b) => b[0].length - a[0].length);
  let o = String(t);
  for (const [a, b] of optPairs) if (o.includes(a)) o = o.split(a).join(b);
  return o;
}
const lineTitle = l => { const hit = l.sku && bySku.get(l.sku); return hit && LANG !== "th" ? tName(hit.p) + (hit.v.label ? " [" + tOpt(hit.v.label) + "]" : "") : l.gift ? String(l.title).replace(/^ของแถม: /, "") : l.title; };
async function loadLang(){
  if (LANGDATA) return LANGDATA;
  const res = await fetch(CONFIG.LANG_URL, {cache: "no-cache"});
  if (!res.ok) throw new Error("lang");
  return (LANGDATA = await res.json());
}
async function setLang(code){
  if (code !== "th"){ try { await loadLang(); } catch (e) { return toast("โหลดภาษาไม่สำเร็จ ลองใหม่อีกครั้งนะคะ"); } }
  LANG = code; store.set("ponpon-lang", code); closeSheet();
  textPairs = []; render(); applyLang();
}
function swapOne(t){
  let o = t;
  for (const [a, b] of textPairs){
    if (typeof a === "string"){ if (o.includes(a)) o = o.split(a).join(b); }
    else if (a.test(o)){ a.lastIndex = 0; o = o.replace(a, (m, pre) => pre + b); }
    if (typeof a !== "string") a.lastIndex = 0;
  }
  return o;
}
function swapTexts(root){
  if (!textPairs.length || !root) return;
  if (root.nodeType === 3){
    if (root.parentElement && root.parentElement.closest('[translate="no"],script,style,textarea')) return;
    const v = swapOne(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; return;
  }
  if (root.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(root.tagName) || root.getAttribute("translate") === "no") return;
  for (const at of ["placeholder", "aria-label", "title"]) if (root.hasAttribute(at)){ const v = swapOne(root.getAttribute(at)); if (v !== root.getAttribute(at)) root.setAttribute(at, v); }
  for (const c of root.childNodes) swapTexts(c);
}
new MutationObserver(list => { if (!textPairs.length) return; for (const m of list){ if (m.type === "characterData") swapTexts(m.target); else for (const n of m.addedNodes) swapTexts(n); } })
  .observe(document.body, {childList: true, subtree: true, characterData: true});
function showLangs(){
  openSheet(`<h2>เลือกภาษา</h2><div class="langs" translate="no">${LANGS.map(([k, n]) => `<button type="button" class="chip" data-act="setlang" data-v="${k}" aria-pressed="${LANG === k}">${n}</button>`).join("")}</div>
    <p class="desc">คำแปลสินค้าและข้อความในแชตยังเป็นภาษาไทย</p>
    <button class="btn line" type="button" data-act="closesheet">ปิด</button>`);
}

const liffReady = CONFIG.LIFF_ID && window.liff ? liff.init({liffId: CONFIG.LIFF_ID}).then(() => true).catch(() => false) : Promise.resolve(false);
{ const rf = new URLSearchParams(location.search).get("ref"); if (rf && /^[A-Za-z0-9]{4,10}$/.test(rf)) store.set("ponpon-ref", rf.toUpperCase()); }
liffReady.then(async ok => { if (ok && liff.isLoggedIn()){ adminCheck().then(x => { if (x && route().page === "me") render(); }); try { profile = await liff.getProfile(); if (["me", "checkout"].includes(route().page)) render(); } catch (e) {}
  if (!loaded) await new Promise(r => { const iv = setInterval(() => { if (loaded || loadError){ clearInterval(iv); r(); } }, 200); });
  memberLoad(); } });
async function start(){
  loadError = false; render();
  try { await load(); } catch (e) { loadError = true; }
  render();
}
start().then(async () => {
  await liffReady;
  const qs = new URLSearchParams(location.search);
  if (qs.get("page") === "orders" && route().page === "home") return go("#orders");
  if (qs.get("page") === "admin" && route().page === "home") return go("#admin");
  const no = qs.get("no") || "";
  if (qs.get("page") === "order" && /^LN-\d{6}-\d{3,}$/.test(no) && route().page === "home") return go("#order/" + no);
  const id = (qs.get("p") || "").toUpperCase();
  if (/^[A-Z0-9]{3,20}$/.test(id) && byId.has(id) && route().page === "home"){ sel = null; qty = 1; go("#product/" + id); }
});
