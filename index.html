<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PonPon Shopping Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Prompt:wght@400;500;700&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --red:#E40019; --green:#CEDA5A; --orange:#F7944A; --white:#F6F6F6; --card:#FFFFFF;
  --ink:#1E1E22; --muted:#75757D; --line:#E4E4E6; --red-soft:#FDE7EA;
  --display:"Poppins","Prompt","Leelawadee UI",Thonburi,sans-serif;
  --body:"Prompt","Leelawadee UI",Thonburi,Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;background:var(--white)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{height:34px;width:auto}
.brand b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;color:var(--red)}
.top h1{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:16px}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 1px 0 var(--line)}
.round.on{color:var(--red)}
.round.on svg{fill:var(--red)}

/* banner */
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:4px -16px 0;padding:0 16px}
.banners::-webkit-scrollbar{display:none}
.banner{position:relative;flex:0 0 100%;scroll-snap-align:center;border-radius:20px;padding:20px 20px 18px;min-height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;text-align:left}
.banner h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.25;max-width:72%;position:relative}
.banner .pill{position:relative;background:var(--card);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;border-radius:999px;padding:7px 18px}
.banner svg.motif{position:absolute;right:-14px;top:50%;width:150px;height:150px;transform:translateY(-50%)}
.b-red{background:var(--red);color:#fff}.b-orange{background:var(--orange);color:#fff}.b-green{background:var(--green);color:var(--ink)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--red);width:20px;border-radius:4px}

/* tabs */
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:16px -16px 12px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:14.5px;color:var(--muted);padding:4px 0 6px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-pressed="true"]{color:var(--ink);font-weight:700;border-color:var(--red)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.cell{position:relative;min-width:0}
.card{display:block;width:100%;text-align:left}
.card .ph{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--card)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card.sold .ph img{opacity:.4}
.card .nm{margin-top:8px;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;margin-top:2px;font-variant-numeric:tabular-nums}
.pr b{font-family:var(--display);font-weight:700;font-size:16px;color:var(--red)}
.pr s{font-size:12px;color:var(--muted)}
.card .st{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.out{color:var(--red);font-weight:500}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--red)}
.heart svg{width:18px;height:18px}
.heart[aria-pressed="true"]{background:var(--red);color:#fff}
.heart[aria-pressed="true"] svg{fill:#fff}
.sec{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:16px;margin-top:10px}
.sec small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.state{grid-column:1/-1;background:var(--card);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 16px;margin-top:4px}
.search input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:16px;outline:none}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 2px}

/* product */
.hero{margin:0 -16px;background:linear-gradient(180deg,var(--red-soft),var(--white))}
.hero img{width:100%;aspect-ratio:1;object-fit:contain}
.pd{background:var(--card);border-radius:24px 24px 0 0;margin:-24px -16px 0;padding:20px 16px 24px;position:relative;display:flex;flex-direction:column;gap:14px}
.pd-h{display:flex;gap:12px;align-items:flex-start}
.pd-h h2{flex:1;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.3}
.pd .pr b{font-size:24px}.pd .pr s{font-size:14px}
.badge{background:var(--green);color:var(--ink);font-family:var(--display);font-weight:700;font-size:11.5px;border-radius:999px;padding:2px 9px}
.lbl{font-size:13px;font-weight:500;margin-bottom:8px}
.lbl span{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:12px;padding:7px 13px;font-size:14px;background:var(--card);max-width:100%;text-align:left}
.chip i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.chip[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:500}
.chip:disabled{opacity:.38;text-decoration:line-through;cursor:not-allowed}
.qrow{display:flex;justify-content:space-between;align-items:center}
.step{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.step button{width:32px;height:32px;border-radius:9px;background:var(--red-soft);color:var(--red);font-weight:700;font-size:18px;line-height:1}
.step button.plus{background:var(--red);color:#fff}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step b{min-width:30px;text-align:center}
.desc{font-size:13px;color:var(--muted)}
.cta{display:flex;gap:10px}
.btn{flex:1;display:block;text-align:center;text-decoration:none;border-radius:999px;padding:13px 16px;font-family:var(--display);font-weight:700;font-size:15px;background:var(--red);color:#fff}
.btn.soft{background:var(--red-soft);color:var(--red)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* cart */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px}
.item img{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:none;background:var(--white)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t .n{font-size:14px;font-weight:500;line-height:1.3}
.item .t .o{font-size:12px;color:var(--muted)}
.item .t .pr b{font-size:18px}
.item .r{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.item .r .trash{color:var(--muted)}
.box{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.box h3{font-family:var(--display);font-weight:700;font-size:15px}
.code{display:flex;gap:8px}
.code input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;text-transform:uppercase;background:var(--white)}
.code button{border-radius:12px;background:var(--ink);color:#fff;padding:0 16px;font-weight:500}
.cp{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;background:var(--white);text-align:left;width:100%}
.cp .l{flex:none;width:76px;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;text-align:center;padding:6px;line-height:1.15;border-right:2px dashed var(--card)}
.cp .m{flex:1;min-width:0;padding:9px 12px}
.cp .m b{display:block;font-size:14px}
.cp .m small{display:block;font-size:12px;color:var(--muted)}
.cp .a{align-self:center;margin-right:10px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;background:var(--red);color:#fff;flex:none}
.cp .a.done{background:var(--line);color:var(--muted)}
.cp.sel{box-shadow:inset 0 0 0 2px var(--red)}
.rows > div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;padding:3px 0}
.rows .neg{color:var(--red)}
.paybar{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:7;padding:0 16px;pointer-events:none}
.paybar > div{max-width:528px;margin:0 auto;background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto}
.paybar small{display:block;font-size:11px;opacity:.7;line-height:1.2}
.paybar b{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.paybar button{background:var(--green);color:var(--ink);border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:700;font-size:15px}
.app.haspay{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld textarea{font-size:16px;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical}
.warn{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:10px}
.bank{background:var(--white);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.bank .acc{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bank .acc b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;word-break:break-all}
.mini{border-radius:999px;background:var(--ink);color:#fff;padding:6px 14px;font-size:13px;flex:none}
.msg{white-space:pre-wrap;word-break:break-word;background:var(--white);border-radius:14px;padding:12px 14px;font-size:14px;font-family:var(--body);user-select:all;-webkit-user-select:all;margin:0}

/* me */
.me{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;border-radius:20px;padding:16px}
.me img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#fff}
.me b{font-family:var(--display);font-weight:700;font-size:17px;display:block}
.me small{opacity:.85}
.me .btn{flex:none;background:#fff;color:var(--red);padding:9px 16px;font-size:13.5px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .cell{flex:0 0 132px}

/* nav, sheet, toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav > div{max-width:528px;margin:0 auto;background:var(--ink);border-radius:999px;display:flex;justify-content:space-around;padding:6px;pointer-events:auto}
.nav button{position:relative;width:52px;height:46px;border-radius:999px;display:grid;place-items:center;color:#9a9aa3}
.nav button[aria-current="page"]{color:var(--orange)}
.nav button[aria-current="page"] svg{fill:var(--orange)}
.nav em{position:absolute;top:4px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.backdrop{position:fixed;inset:0;background:rgba(30,30,34,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:86%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet > div{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:17px}
.share{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px}
.share button{display:flex;flex-direction:column;align-items:center;gap:6px}
.share span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;max-width:88%;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view"><div class="state" style="margin-top:20px">กำลังโหลดสินค้า...</div></main>
</div>
<div class="paybar" id="paybar" hidden></div>
<nav class="nav" aria-label="เมนูหลัก"><div id="nav"></div></nav>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ================= ตั้งค่า ================= */
const CONFIG = {
  API_URL: "https://ponpon-shop-api.workwithjariya.workers.dev/",
  LIFF_ID: "2011930315-gkrgcbEk",
  OA_ID: "@ponponco",
  NAMES_URL: "names.json",     // ชื่อสั้นของสินค้า
  SHOP_URL: "shop.json",       // แบนเนอร์ โค้ดส่วนลด ค่าส่ง บัญชีธนาคาร สินค้าขายดี
  LOGO_URL: "images/logo.png", // โลโก้ร้าน (อัปไฟล์ไว้ที่ images/logo.png)
  CONFIRM_TEXT: "ยืนยันคำสั่งซื้อ",
  GROUP_LEN: 7,
  IMAGE_DIR: "images/"
};
const CAT_TH = {"Home Suppliers":"ของใช้ในบ้าน","Fashion&Accessories":"แฟชั่นและเครื่องประดับ","Storage&Organization":"จัดเก็บและจัดระเบียบ","Beauty&Care Products":"ความงามและดูแลตัวเอง","Kitchen Utensils":"เครื่องครัว","Cleaning":"ทำความสะอาด","Gadgets":"แกดเจ็ต","Light&Digital":"โคมไฟและดิจิทัล","Pet Care":"สัตว์เลี้ยง","อุปโภค&บริโภค":"อุปโภคบริโภค"};
/* ========================================== */

const RE_PAREN = /^(.*?)\s*[\(（]([^()（）]*)[\)）]\s*$/;
const RE_SIZE = /^(?:[A-Z]{2})?(XS|S|M|L|XL)$/;
const RE_MID = /^(V\d+)?([A-Z]{2})?(XS|S|M|L|XL|2XL|3XL|OS)?$/;
const CODE_TH = {WH:"ขาว",BK:"ดำ",GN:"เขียว",BL:"ฟ้า",PK:"ชมพู",CM:"ครีม",YE:"เหลือง",OR:"ส้ม",GY:"เทา",NB:"น้ำเงิน",PP:"ม่วง",TS:"ใส",BR:"น้ำตาล",RD:"แดง",BG:"เบจ"};
const SWATCH = [["น้ำเงิน","#3d5a9e"],["กรม","#2f3f6b"],["กาแฟ","#8a6a52"],["ฟ้า","#a9d4f5"],["ชมพู","#f6b9d4"],["เขียว","#bfe6cc"],["เหลือง","#fbe38a"],["ม่วง","#cdb8ee"],["ส้ม","#f8b27a"],["แดง","#e2575b"],["น้ำตาล","#a67c5b"],["ครีม","#f4e6c8"],["เบจ","#e8d9bd"],["เทา","#b5b5bb"],["ขาว","#ffffff"],["ดำ","#2b2b2f"],["ใส","#eef6f8"]];
const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#FDE7EA"/><text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#E40019">PONPON</text></svg>');
const ICON = {
  home:'<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  cart:'<path d="M3 4h2.5l2.2 11h10.6l2-8H7"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
  heart:'<path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z"/>',
  back:'<path d="M15 5l-7 7 7 7"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const MOTIF = [
  '<svg class="motif" viewBox="0 0 100 100" aria-hidden="true"><path fill="#CEDA5A" d="M50 6c3 26 18 41 44 44-26 3-41 18-44 44-3-26-18-41-44-44 26-3 41-18 44-44z"/></svg>',
  '<svg class="motif" viewBox="0 0 100 100" aria-hidden="true"><g fill="#F6F6F6"><rect x="38" y="6" width="24" height="88" rx="12" transform="rotate(45 50 50)"/><rect x="38" y="6" width="24" height="88" rx="12" transform="rotate(-45 50 50)"/></g></svg>',
  '<svg class="motif" viewBox="0 0 100 100" aria-hidden="true"><g fill="#E40019"><path d="M18 46a32 26 0 0 1 64 0z"/><path d="M18 84a32 26 0 0 1 64 0z"/></g></svg>'
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Number(n).toLocaleString("th-TH");
const baht = n => "฿" + num(n);
const $ = id => document.getElementById(id);
const swatch = label => { for (const [k, hex] of SWATCH) if (label.includes(k)) return hex; return ""; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- สินค้า: รวม SKU เป็นสินค้าเดียว และแยกตัวเลือกเป็นสี/ขนาด ---------- */
function splitDims(p){
  const vs = p.variants; if (vs.length < 2) return null;
  const parsed = vs.map(v => { const m = v.mid.match(RE_MID); return m ? {c: m[2] || "", s: (m[1] || "") + (m[3] || "")} : null; });
  if (parsed.some(x => !x)) return null;
  const cs = [...new Set(parsed.map(x => x.c))], ss = [...new Set(parsed.map(x => x.s))];
  if (cs.length < 2 || ss.length < 2 || cs.includes("")) return null;
  const count = (k, val) => parsed.filter(x => x[k] === val).length;
  if (!cs.some(c => count("c", c) > 1) || !ss.some(s => count("s", s) > 1)) return null;
  if (new Set(parsed.map(x => x.c + "|" + x.s)).size !== vs.length) return null;
  vs.forEach((v, i) => { v.c = parsed[i].c; v.s = parsed[i].s; v.tok = v.raw.replace(/(\D)-|-(\D)/g, "$1 $2").split(/[,\s\/]+/).filter(Boolean); });
  const common = arr => arr.reduce((a, t) => a.filter(x => t.includes(x)));
  const all = common(vs.map(v => v.tok));
  const pass1 = (key, vals) => { const o = {}; for (const val of vals){ const g = vs.filter(v => v[key] === val); o[val] = g.length > 1 ? common(g.map(v => v.tok)).filter(x => !all.includes(x)) : null; } return o; };
  const cn = pass1("c", cs), sn = pass1("s", ss);
  for (const v of vs){
    if (cn[v.c] === null) cn[v.c] = v.tok.filter(x => !all.includes(x) && !(sn[v.s] || []).includes(x));
    if (sn[v.s] === null) sn[v.s] = v.tok.filter(x => !all.includes(x) && !(cn[v.c] || []).includes(x));
  }
  const sizeFallback = s => s === "" ? "มาตรฐาน" : s === "OS" ? "ฟรีไซซ์" : s.replace(/^V/, "").replace(/OS$/, "") || s;
  const colors = cs.map(c => ({id: c, name: (cn[c] || []).join(" ") || CODE_TH[c] || c}));
  const sizes = ss.map(s => ({id: s, name: (sn[s] || []).join(" ") || sizeFallback(s)}));
  for (const c of colors) c.hex = swatch(c.name);
  return {colors, sizes};
}
function buildProducts(rows){
  const map = new Map();
  for (const r of rows){
    if (!r.sku || !(r.price > 0)) continue;
    const id = r.sku.slice(0, CONFIG.GROUP_LEN);
    const name = (r.name || "").trim(), m = name.match(RE_PAREN);
    if (!map.has(id)) map.set(id, {id, variants: []});
    map.get(id).variants.push({
      sku: r.sku, price: r.price, orig: r.orig || r.price, stock: r.stock, image: r.image, cat: r.category || "อื่นๆ",
      base: m ? m[1].trim() : name, label: m ? m[2].trim() : "", raw: m ? m[2].trim() : "",
      mid: r.sku.slice(CONFIG.GROUP_LEN).replace(/-?\d+$/, "")
    });
  }
  const list = [];
  for (const p of map.values()){
    const tally = new Map();
    for (const v of p.variants) tally.set(v.base, (tally.get(v.base) || 0) + 1);
    p.name = [...tally].sort((a, b) => b[1] - a[1])[0][0];
    for (const v of p.variants) if (v.base !== p.name){ v.label = v.base + (v.label ? " (" + v.label + ")" : ""); v.odd = true; }
    const seen = new Map();
    for (const v of p.variants) seen.set(v.label, (seen.get(v.label) || 0) + 1);
    for (const v of p.variants){
      if (p.variants.length > 1 && (seen.get(v.label) > 1 || !v.label)){
        const s = v.mid.match(RE_SIZE), extra = s ? "ไซซ์ " + s[1] : v.mid;
        v.label = [v.label, extra].filter(Boolean).join(" ") || v.sku;
      }
      v.hex = swatch(v.label);
    }
    p.dims = p.variants.some(v => v.odd) ? null : splitDims(p);
    p.cat = p.variants[0].cat;
    p.stock = p.variants.reduce((a, v) => a + v.stock, 0);
    const prices = p.variants.map(v => v.price);
    p.price = Math.min(...prices); p.multiPrice = Math.max(...prices) > p.price;
    p.orig = Math.min(...p.variants.map(v => v.orig));
    list.push(p);
  }
  return list.sort((a, b) => (b.stock > 0) - (a.stock > 0) || b.id.localeCompare(a.id));
}

function readShop(shop){
  const pay = shop.payment || {};
  return {
    discountPercent: Math.min(90, Math.max(0, Number(shop.discountPercent) || 0)),
    bestSellers: Array.isArray(shop.bestSellers) ? shop.bestSellers : [],
    newCount: Number.isFinite(Number(shop.newCount)) ? Number(shop.newCount) : 12,
    shippingFee: shop.shippingFee === null || shop.shippingFee === undefined || shop.shippingFee === "" ? null : Math.max(0, Number(shop.shippingFee) || 0),
    freeShippingOver: Math.max(0, Number(shop.freeShippingOver) || 0),
    payment: {bank: String(pay.bank || ""), accountNumber: String(pay.accountNumber || ""), accountName: String(pay.accountName || ""), text: String(pay.text || "")},
    banners: Array.isArray(shop.banners) && shop.banners.length ? shop.banners : [
      {title: "กดรับโค้ดส่วนลดสุดพิเศษ", button: "คลิกเลย!", color: "orange", action: "coupons"},
      {title: "ลดพิเศษ 20% ส่งฟรีทุกออเดอร์", button: "ช้อปเลย!", color: "red", action: "products"}
    ],
    coupons: (Array.isArray(shop.coupons) ? shop.coupons : []).filter(c => c && c.code).map(c => ({
      code: String(c.code).toUpperCase(), title: String(c.title || ""), type: c.type === "amount" || c.type === "freeship" ? c.type : "percent",
      value: Math.max(0, Number(c.value) || 0), min: Math.max(0, Number(c.min) || 0), expires: c.expires ? String(c.expires) : ""
    })),
    categoryNames: shop.categoryNames || {},
    saveUrl: String(shop.saveUrl || "")
  };
}
async function load(){
  const opt = url => fetch(url, {cache: "no-cache"}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const [res, names, shop] = await Promise.all([fetch(CONFIG.API_URL, {cache: "no-store"}), opt(CONFIG.NAMES_URL), opt(CONFIG.SHOP_URL)]);
  const data = await res.json();
  if (!Array.isArray(data.products)) throw new Error("no products");
  SHOP = readShop(shop);
  PRODUCTS = buildProducts(data.products.map(r => ({...r, orig: r.price, price: linePrice(r.price)})));
  byId = new Map(); bySku = new Map();
  for (const p of PRODUCTS){
    p.title = names[p.id] || p.name;
    p.search = (p.title + " " + p.name + " " + p.id + " " + p.variants.map(v => v.label).join(" ")).toLowerCase();
    byId.set(p.id, p);
    for (const v of p.variants) bySku.set(v.sku, {p, v});
  }
  for (const sku of [...cart.keys()]) if (!bySku.has(sku)) cart.delete(sku);
  loaded = true; loadError = false;
}

const today = () => new Date().toISOString().slice(0, 10);
const couponOf = code => SHOP.coupons.find(c => c.code === String(code || "").toUpperCase());
const couponFace = c => c.type === "freeship" ? "ส่งฟรี" : c.type === "amount" ? "ลด " + baht(c.value) : "ลด " + c.value + "%";
const couponNote = c => [c.min ? "ขั้นต่ำ " + baht(c.min) : "ไม่มีขั้นต่ำ", c.expires ? "ถึง " + c.expires : ""].filter(Boolean).join(" · ");
function couponProblem(c, goods){
  if (!c) return "ไม่พบโค้ดนี้ค่ะ ลองตรวจตัวสะกดอีกครั้ง";
  if (c.expires && today() > c.expires) return "โค้ดนี้หมดอายุแล้วค่ะ";
  if (goods < c.min) return `โค้ดนี้ใช้ได้เมื่อซื้อครบ ${baht(c.min)} ค่ะ (ขาดอีก ${baht(c.min - goods)})`;
  return "";
}
function totals(){
  let goods = 0, n = 0;
  for (const [sku, k] of cart){ goods += k * bySku.get(sku).v.price; n += k; }
  let c = couponOf(usedCoupon); if (c && couponProblem(c, goods)) c = null;
  let discount = 0;
  if (c && c.type === "percent") discount = Math.round(goods * Math.min(100, c.value) / 100);
  if (c && c.type === "amount") discount = Math.min(goods, c.value);
  let ship = SHOP.shippingFee === null ? null : (SHOP.freeShippingOver > 0 && goods >= SHOP.freeShippingOver ? 0 : SHOP.shippingFee);
  if (c && c.type === "freeship") ship = 0;
  return {goods, n, discount, ship, coupon: c, total: goods - discount + (ship || 0)};
}
const shipLabel = ship => ship === null ? "แอดมินแจ้งในแชต" : ship === 0 ? "ฟรี" : baht(ship);
function couponCard(c, mode){

  const action = mode === "pick"

    : `<span class="a${have || expired ? " done" : ""}">${expired ? "หมดอายุ" : have ? "เก็บแล้ว" : "เก็บ"}</span>`;
  return `<button class="cp${mode === "pick" && usedCoupon === c.code ? " sel" : ""}" type="button" data-act="${mode === "pick" ? "usecoupon" : "collect"}" data-code="${esc(c.code)}">
    <span class="l">${esc(couponFace(c))}</span><span class="m"><b>${esc(c.title || c.code)}</b><small>โค้ด ${esc(c.code)} · ${esc(couponNote(c))}</small></span>${action}</button>`;
}

let bannerTimer = null;

  $("nav").innerHTML = navBar(r);

  const pay = $("paybar"); pay.hidden = true; $("app").classList.remove("haspay");
  if (!loaded){
    $("view").innerHTML = loadError ? `<div class="state" style="margin-top:20px">โหลดสินค้าไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง<br><br><button class="btn" type="button" data-act="retry">ลองใหม่</button></div>` : `<div class="state" style="margin-top:20px">กำลังโหลดสินค้า...</div>`;
    return;
  }
  const views = {home: viewHome, products: viewProducts, product: () => viewProduct(r.arg), cart: viewCart, checkout: viewCheckout, me: viewMe};
  $("view").innerHTML = (views[r.page] || viewHome)();
  if ((r.page === "cart" || r.page === "checkout") && cart.size){
    const t = totals();
    pay.innerHTML = `<div><span><small>${t.ship === null ? "ยอดสินค้า" : "ยอดรวม"}</small><b>${baht(t.total)}</b></span><button type="button" data-act="${r.page === "cart" ? "checkout" : "order"}">${r.page === "cart" ? "ชำระเงิน" : "ยืนยันสั่งซื้อ"}</button></div>`;
    pay.hidden = false; $("app").classList.add("haspay");
  }
  if (r.page === "home") startBanners();

function startBanners(){
  const el = $("banners"), dots = $("dots"); if (!el || el.children.length < 2) return;
  const mark = () => { const i = Math.round(el.scrollLeft / el.clientWidth); [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i)); };
  el.addEventListener("scroll", mark, {passive: true});
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  bannerTimer = setInterval(() => { const i = Math.round(el.scrollLeft / el.clientWidth), n = (i + 1) % el.children.length; el.scrollTo({left: n * el.clientWidth, behavior: "smooth"}); }, 4500);
}

async function shareTo(k, id){

}

/* ---------- สั่งซื้อ ---------- */
function checkDraft(){
  if (draft.name.trim().length < 2) return "กรอกชื่อผู้รับก่อนนะคะ";
  const d = draft.phone.replace(/\D/g, ""); if (d.length < 9 || d.length > 10) return "เบอร์โทรควรเป็นตัวเลข 9 หรือ 10 หลักค่ะ";
  if (draft.address.trim().length < 10) return "กรอกที่อยู่จัดส่งให้ครบ รวมรหัสไปรษณีย์ด้วยนะคะ";
  return "";
}
const orderItems = () => [...cart].map(([sku, k]) => { const {p, v} = bySku.get(sku); return {sku, name: p.title, option: v.label, qty: k, price: v.price}; });
function orderText(){
  const t = totals();
  const rows = orderItems().map((it, i) => `${i + 1}. ${it.name.length > 45 ? it.name.slice(0, 45) + "…" : it.name}${it.option ? " [" + it.option + "]" : ""}\n    ${it.sku} x${it.qty} = ${baht(it.qty * it.price)}`);
  const lines = ["🛒 สั่งซื้อสินค้า", ...rows, "", `ค่าสินค้า ${t.n} ชิ้น ${baht(t.goods)}`];
  if (t.coupon) lines.push(`โค้ด ${t.coupon.code} (${couponFace(t.coupon)})${t.discount ? " −" + baht(t.discount) : ""}`);
  lines.push(`ค่าจัดส่ง ${shipLabel(t.ship)}`, `${t.ship === null ? "ยอดสินค้า" : "ยอดชำระ"} ${baht(t.total)}`);
  lines.push("", "📦 ผู้รับ", draft.name.trim(), "โทร " + draft.phone.trim(), draft.address.trim());
  if (draft.note.trim()) lines.push("หมายเหตุ: " + draft.note.trim());
  return lines.join("\n");
}
async function saveOrder(){
  if (!SHOP.saveUrl) return;
  const t = totals(), rec = {time: new Date().toISOString(), items: orderItems(), goods: t.goods, discount: t.discount, coupon: t.coupon ? t.coupon.code : "", shipping: t.ship, total: t.total,
    customer: {name: draft.name.trim(), phone: draft.phone.trim(), address: draft.address.trim(), note: draft.note.trim()}, line: profile ? {userId: profile.userId, displayName: profile.displayName} : {}};
  try { await Promise.race([fetch(SHOP.saveUrl, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"}, body: JSON.stringify(rec)}), new Promise(r => setTimeout(r, 5000))]); } catch (e) {}
}
async function placeOrder(){
  if (sending) return;
  formError = checkDraft(); if (formError){ render(); return scrollTo(0, 0); }
  sending = true; toast("กำลังเช็กสต็อกล่าสุด...");
  try {
    await load();
    let changed = false;
    for (const [sku, k] of [...cart]){ const st = bySku.get(sku).v.stock; if (k > st){ changed = true; if (st > 0) cart.set(sku, st); else cart.delete(sku); } }
    saveCart();
    if (changed){ sending = false; toast("สต็อกเพิ่งเปลี่ยน เราปรับจำนวนในตะกร้าให้แล้ว ตรวจดูอีกครั้งนะคะ"); return go("#cart"); }
  } catch (e) { sending = false; formError = "เช็กสต็อกไม่สำเร็จ ลองกดยืนยันอีกครั้งนะคะ"; return render(); }
  if (draft.remember) store.set("ponpon-customer", draft); else { try { localStorage.removeItem("ponpon-customer"); } catch (e) {} }
  const text = orderText();
  await saveOrder();
  if (CONFIG.LIFF_ID && window.liff && await liffReady && liff.isInClient()){
    try {
      await liff.sendMessages([{type: "text", text}, {type: "text", text: CONFIG.CONFIRM_TEXT}]);
      cart.clear(); saveCart(); usedCoupon = ""; store.set("ponpon-used-coupon", ""); sending = false;
      return liff.closeWindow();
    } catch (e) {}
  }
  sending = false;
  openSheet(`<h2>ส่งข้อความนี้ให้แอดมิน</h2><pre class="msg" id="msg">${esc(text)}</pre>
    <button class="btn" type="button" data-act="copyorder">คัดลอกข้อความ</button>
    <a class="btn line" href="https://line.me/R/ti/p/${encodeURIComponent(CONFIG.OA_ID)}">เปิดแชต PonPon แล้ววางข้อความ</a>`);
}

/* ---------- การกดปุ่มทั้งหมด ---------- */
function toggleFav(id){
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  store.set("ponpon-fav", [...favs]);
  toast(favs.has(id) ? "เพิ่มในรายการถูกใจแล้ว" : "นำออกจากรายการถูกใจแล้ว");
}
function setCoupon(code){
  const c = couponOf(code), problem = couponProblem(c, totals().goods);
  if (!c) return toast(problem);
  myCoupons.add(c.code); store.set("ponpon-coupons", [...myCoupons]);
  usedCoupon = c.code; store.set("ponpon-used-coupon", usedCoupon);
  toast(problem || `ใช้โค้ด ${c.code} แล้ว`);
}
document.addEventListener("click", e => {
  if (e.target === $("backdrop")) return closeSheet();
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, r = route(), p = byId.get(r.arg);
  const y = scrollY, keep = () => { render(); scrollTo(0, y); };
  if (a === "nav"){ if (b.dataset.to === "#products" && r.page === "home"){ listQ = ""; } return go(b.dataset.to); }
  if (a === "back") return history.length > 1 ? history.back() : go("#home");
  if (a === "retry") return start();
  if (a === "open"){ sel = b.dataset.sku || null; qty = 1; closeSheet(); go("#product/" + encodeURIComponent(b.dataset.id)); return scrollTo(0, 0); }
  if (a === "fav"){ toggleFav(b.dataset.id); return keep(); }
  if (a === "hometab"){ homeTab = b.dataset.k; return keep(); }
  if (a === "listcat"){ listCat = b.dataset.k; return keep(); }
  if (a === "banner"){ const bn = SHOP.banners[Number(b.dataset.i)] || {}; return bn.action === "coupons" ? showCoupons() : bn.action === "products" ? go("#products") : bn.link ? openExternal(bn.link) : null; }
  if (a === "coupons") return showCoupons();
  if (a === "closesheet") return closeSheet();
  if (a === "collect"){ const c = couponOf(b.dataset.code); if (!c || (c.expires && today() > c.expires)) return; myCoupons.add(c.code); store.set("ponpon-coupons", [...myCoupons]); toast("เก็บโค้ดแล้ว ใช้ได้ที่หน้าตะกร้า"); if (!$("sheet").hidden) showCoupons(); return keep(); }
  if (a === "usecoupon"){ setCoupon(b.dataset.code); return keep(); }
  if (a === "applycode"){ const v = ($("code").value || "").trim(); if (!v) return toast("กรอกโค้ดส่วนลดก่อนนะคะ"); setCoupon(v); return keep(); }
  if (a === "clearcoupon"){ usedCoupon = ""; store.set("ponpon-used-coupon", ""); return keep(); }
  if (a === "share") return showShare(b.dataset.id);
  if (a === "shareto") return shareTo(b.dataset.k, b.dataset.id);
  if (a === "picksku"){ sel = b.dataset.v; qty = 1; return keep(); }
  if (a === "pickc" && p){ const cur = bySku.get(sel).v; const nx = p.variants.find(x => x.c === b.dataset.v && x.s === cur.s && x.stock > 0) || p.variants.find(x => x.c === b.dataset.v && x.stock > 0) || p.variants.find(x => x.c === b.dataset.v); sel = nx.sku; qty = 1; return keep(); }
  if (a === "picks" && p){ const cur = bySku.get(sel).v; const nx = p.variants.find(x => x.c === cur.c && x.s === b.dataset.v); if (nx){ sel = nx.sku; qty = 1; } return keep(); }
  if (a === "qplus"){ qty++; return keep(); }
  if (a === "qminus"){ qty--; return keep(); }
  if (a === "add" || a === "buy"){ cart.set(sel, (cart.get(sel) || 0) + qty); qty = 1; saveCart(); if (a === "buy") return go("#cart"); toast("ใส่ตะกร้าแล้ว"); return keep(); }
  if (a === "inc" || a === "dec" || a === "remove"){
    const k = a === "remove" ? 0 : (cart.get(b.dataset.sku) || 0) + (a === "inc" ? 1 : -1);
    if (k <= 0) cart.delete(b.dataset.sku); else cart.set(b.dataset.sku, k);
    saveCart(); return keep();
  }
  if (a === "checkout"){ formError = ""; go("#checkout"); return scrollTo(0, 0); }
  if (a === "order") return placeOrder();
  if (a === "copyacc") return copyText(SHOP.payment.accountNumber.replace(/[^\d]/g, ""), "คัดลอกเลขบัญชีแล้ว");
  if (a === "copyamt") return copyText(String(totals().total), "คัดลอกยอดโอนแล้ว");
  if (a === "copyorder") return copyText(orderText(), "คัดลอกแล้ว");
  if (a === "saveaddr"){ draft.remember = true; store.set("ponpon-customer", draft); return toast("บันทึกที่อยู่แล้ว"); }
  if (a === "login"){ return liffReady.then(ok => ok ? liff.login({redirectUri: location.href}) : toast("เปิดหน้านี้จากในแอป LINE เพื่อเข้าสู่ระบบนะคะ")); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f){ draft[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value; return; }
  if (t.id === "q"){ listQ = t.value; $("plist").innerHTML = productList(); }
  if (t.id === "only"){ listOnly = t.checked; $("plist").innerHTML = productList(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); if (e.key === "Enter" && e.target.id === "code"){ e.preventDefault(); setCoupon(e.target.value.trim()); render(); } });
window.addEventListener("hashchange", () => { closeSheet(); render(); });

/* ---------- เริ่มต้น ---------- */
const liffReady = CONFIG.LIFF_ID && window.liff ? liff.init({liffId: CONFIG.LIFF_ID}).then(() => true).catch(() => false) : Promise.resolve(false);
liffReady.then(async ok => { if (ok && liff.isLoggedIn()){ try { profile = await liff.getProfile(); if (route().page === "me") render(); } catch (e) {} } });
async function start(){
  loadError = false; render();
  try { await load(); } catch (e) { loadError = true; }
  render();
}
start().then(async () => {
  await liffReady;
  const id = (new URLSearchParams(location.search).get("p") || "").toUpperCase();
  if (/^[A-Z0-9]{3,20}$/.test(id) && byId.has(id) && route().page === "home"){ sel = null; qty = 1; go("#product/" + id); }
});
</script>
