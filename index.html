<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PonPon Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --sky:#dcefff; --cream:#fff3dc; --paper:#fffdf8; --ink:#3b3b40; --muted:#716e78;
  --pink:#f6b9d4; --pink-deep:#c8437f; --mint:#bfe6cc; --red:#d63b40; --line:#e6dfd2;
  --display:"Mali","IBM Plex Sans Thai Looped","Leelawadee UI",Thonburi,sans-serif;
  --body:"IBM Plex Sans Thai Looped","Leelawadee UI",Thonburi,Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:repeating-linear-gradient(90deg,var(--sky) 0 44px,var(--cream) 44px 88px);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 120px;display:flex;flex-direction:column;gap:14px}

.win{background:var(--paper);border:3px solid var(--ink);border-radius:18px 18px 14px 14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.win h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;margin:0}
.win h1 small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--display);font-weight:500;font-size:14px;padding:6px 12px;border:2.5px solid var(--ink);border-radius:12px 12px 4px 4px;background:var(--paper);color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--sky);color:var(--ink);font-weight:700}
.bar{display:flex;align-items:center;gap:10px}
.bar input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:999px;padding:8px 16px;background:var(--paper)}
.bar i{flex:none;width:22px;height:22px;border:3px solid var(--ink);border-radius:5px}
.bar i + i{border-radius:50%}
.opt-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:0;overflow:hidden}
.card.sold .pic img{opacity:.45}
.pic{aspect-ratio:1;width:100%;background:var(--sky);border-bottom:2.5px solid var(--ink);display:block;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-family:var(--display);font-weight:700;font-size:17px;color:var(--pink-deep)}
.price small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.out{color:var(--red);font-weight:600}
.state{grid-column:1/-1;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:24px;text-align:center}
.state button{margin-top:10px}
.sec{grid-column:1/-1;margin:14px 0 0;padding:8px 14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;font-family:var(--display);font-size:17px;color:var(--red)}
.sec small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.sec.ok{color:var(--ink);margin-top:4px}
.price s{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-right:5px}
.deal{font-size:12px;font-weight:600;color:var(--pink-deep)}
.promo{margin:0;background:var(--pink);border:2.5px solid var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:700;text-align:center}
.cell{position:relative;display:flex;min-width:0}
.cell .card{width:100%}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;padding:0;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--pink-deep);font-size:17px;line-height:1}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;font-size:14px;padding:8px 10px}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.user img{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);object-fit:cover}
.tot{display:flex;flex-direction:column;gap:4px;background:var(--cream);border:2.5px solid var(--ink);border-radius:12px;padding:10px 14px;font-variant-numeric:tabular-nums}
.tot > div{display:flex;justify-content:space-between;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:9px 12px;width:100%;resize:vertical}
.pay{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2.5px solid var(--ink);border-radius:12px;padding:12px}
.pay .label{margin:0;align-self:flex-start}
.qr{width:200px;max-width:100%;background:#fff;border-radius:8px}
.qr svg{display:block;width:100%;height:auto}
.payline{font-weight:600}
.paytext{margin:0;white-space:pre-wrap}
.desc{margin:0;font-size:13px;color:var(--muted)}

.cartbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:3px solid var(--ink);z-index:5}
.cartbar div{max-width:728px;margin:0 auto}
.btn{display:block;width:100%;text-align:center;text-decoration:none;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:11px 18px;background:var(--pink);font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--paper)}

.backdrop{position:fixed;inset:0;background:rgba(59,59,64,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:90%;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet > div{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);font-size:18px;line-height:1.35;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{flex:none;width:36px;height:36px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);font-weight:700}
.detail{display:flex;gap:12px;align-items:center}
.detail .pic{flex:none;width:130px;border:2.5px solid var(--ink);border-radius:12px}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);padding:7px 12px;text-align:left;line-height:1.25;max-width:100%}
.opt small{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--sky)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.qty{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.qty button{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);font-weight:700;font-size:18px}
.qty button:disabled{opacity:.4;cursor:not-allowed}
.qty b{min-width:28px;text-align:center;font-size:17px}
.sku{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-all}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:13.5px;line-height:1.35}
.sum{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.warn{margin:0;background:var(--cream);border:2px dashed var(--red);border-radius:12px;padding:8px 12px;font-size:13px}
.msg{white-space:pre-wrap;word-break:break-word;background:var(--mint);border:2.5px solid var(--ink);border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14px;margin:0;font-family:var(--body);user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="win">
    <h1>PonPon ช้อปเลย!<small>เลือกสินค้า ใส่ตะกร้า แล้วส่งออเดอร์ให้แอดมินในแชต</small></h1>
    <div class="user" id="user" hidden></div>
    <div class="tabs" id="tabs"></div>
    <div class="bar"><input id="q" type="search" placeholder="ค้นหาสินค้า" aria-label="ค้นหาสินค้า"><i></i><i></i></div>
    <label class="opt-row"><input type="checkbox" id="instock"> แสดงเฉพาะสินค้าที่มีของ</label>
  </header>
  <p class="promo" id="promo" hidden></p>
  <main class="grid" id="grid"><div class="state">กำลังโหลดสินค้า...</div></main>
</div>

<div class="cartbar" id="cartbar" hidden><div><button class="btn" id="openCart" type="button"></button></div></div>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ================= ตั้งค่า ================= */
const CONFIG = {
  API_URL: "https://ponpon-shop-api.workwithjariya.workers.dev/",
  LIFF_ID: "2011930315-gkrgcbEk",
  OA_ID: "@ponponco",          // ไอดี LINE OA ของ PonPon
  SHOP_URL: "shop.json",       // โปรโมชัน ส่วนลด และสินค้าขายดี แก้ได้ในไฟล์ shop.json
  CONFIRM_TEXT: "ยืนยันคำสั่งซื้อ", // ข้อความที่ส่งต่อท้ายออเดอร์ ใช้เป็นคีย์เวิร์ดตอบกลับอัตโนมัติ
  NAMES_URL: "names.json",   // ชื่อสั้นสำหรับหน้าร้าน แก้ได้ในไฟล์ names.json
  GROUP_LEN: 7,                // SKU กี่ตัวแรกที่ถือเป็นสินค้าเดียวกัน
  IMAGE_DIR: "images/"         // โฟลเดอร์รูปบน GitHub: images/PP00383.jpg (รูปหลัก) หรือ images/PP00383BK26001.jpg (รูปของตัวเลือก)
};
/* ========================================== */

const RE_PAREN = /^(.*?)\s*[\(（]([^()（）]*)[\)）]\s*$/;
const RE_SIZE = /^(?:[A-Z]{2})?(XS|S|M|L|XL)$/;
const SWATCH = [["น้ำเงิน","#3d5a9e"],["กรม","#2f3f6b"],["กาแฟ","#8a6a52"],["ฟ้า","#a9d4f5"],["ชมพู","#f6b9d4"],["เขียว","#bfe6cc"],["เหลือง","#fbe38a"],["ม่วง","#cdb8ee"],["ส้ม","#f8b27a"],["แดง","#e2575b"],["น้ำตาล","#a67c5b"],["ครีม","#f4e6c8"],["เบจ","#e8d9bd"],["เทา","#b5b5bb"],["ขาว","#ffffff"],["ดำ","#3b3b40"],["ใส","#eef6f8"]];
const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#dcefff"/><text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#3b3b40">PonPon</text></svg>');

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const baht = n => Number(n).toLocaleString("th-TH") + " บาท";
const $ = id => document.getElementById(id);
const swatch = label => { for (const [k, hex] of SWATCH) if (label.includes(k)) return hex; return ""; };

/* รวม SKU ที่ตัวอักษรชุดแรกเหมือนกันให้เป็นสินค้าเดียว แล้วใช้ข้อความในวงเล็บท้ายชื่อเป็นชื่อตัวเลือก */
function buildProducts(rows){
  const map = new Map();
  for (const r of rows){
    if (!r.sku || !(r.price > 0)) continue;
    const id = r.sku.slice(0, CONFIG.GROUP_LEN);
    const name = (r.name || "").trim(), m = name.match(RE_PAREN);
    if (!map.has(id)) map.set(id, {id, variants: []});
    map.get(id).variants.push({
      sku: r.sku, price: r.price, orig: r.orig || r.price, stock: r.stock, image: r.image, cat: r.category || "อื่นๆ",
      base: m ? m[1].trim() : name, label: m ? m[2].trim() : "",
      mid: r.sku.slice(CONFIG.GROUP_LEN).replace(/-?\d+$/, "")
    });
  }
  const list = [];
  for (const p of map.values()){
    const tally = new Map();
    for (const v of p.variants) tally.set(v.base, (tally.get(v.base) || 0) + 1);
    p.name = [...tally].sort((a, b) => b[1] - a[1])[0][0];
    for (const v of p.variants) if (v.base !== p.name) v.label = v.base + (v.label ? " (" + v.label + ")" : "");
    const seen = new Map();
    for (const v of p.variants) seen.set(v.label, (seen.get(v.label) || 0) + 1);
    for (const v of p.variants){
      if (p.variants.length > 1 && (seen.get(v.label) > 1 || !v.label)){
        const s = v.mid.match(RE_SIZE), extra = s ? "ไซซ์ " + s[1] : v.mid;
        v.label = [v.label, extra].filter(Boolean).join(" ") || v.sku;
      }
      v.hex = swatch(v.label);
    }
    p.cat = p.variants[0].cat;
    p.stock = p.variants.reduce((a, v) => a + v.stock, 0);
    const prices = p.variants.map(v => v.price);
    p.price = Math.min(...prices); p.multiPrice = Math.max(...prices) > p.price;
    p.orig = Math.min(...p.variants.map(v => v.orig));
    p.search = (p.name + " " + p.id + " " + p.variants.map(v => v.label).join(" ")).toLowerCase();
    list.push(p);
  }
  return list.sort((a, b) => (b.stock > 0) - (a.stock > 0) || b.id.localeCompare(a.id));
}

let SHOP = {promoText: "", discountPercent: 0, bestSellers: [], newCount: 8, shippingFee: null, freeShippingOver: 0, payment: {promptpayId: "", accountName: "", text: ""}, saveUrl: ""};
const linePrice = n => n > 0 && SHOP.discountPercent > 0 ? Math.max(1, Math.round(n * (100 - SHOP.discountPercent) / 100)) : n;
let PRODUCTS = [], bySku = new Map(), cat = "ทั้งหมด", sel = null, qty = 1, sending = false;
const FAV = "♥ ถูกใจ";
const favs = new Set();
try { for (const id of JSON.parse(localStorage.getItem("ponpon-fav") || "[]")) favs.add(id); } catch (e) {}
function toggleFav(id){
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  try { localStorage.setItem("ponpon-fav", JSON.stringify([...favs])); } catch (e) {}
  toast(favs.has(id) ? "เพิ่มในรายการถูกใจแล้ว" : "นำออกจากรายการถูกใจแล้ว");
}
const cart = new Map();
try { for (const [k, v] of JSON.parse(localStorage.getItem("ponpon-cart") || "[]")) cart.set(k, v); } catch (e) {}
const saveCart = () => { try { localStorage.setItem("ponpon-cart", JSON.stringify([...cart])); } catch (e) {} };

async function load(){
  const opt = url => fetch(url, {cache: "no-cache"}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const [res, names, shop] = await Promise.all([
    fetch(CONFIG.API_URL, {cache: "no-store"}),
    opt(CONFIG.NAMES_URL), opt(CONFIG.SHOP_URL)
  ]);
  const data = await res.json();
  if (!Array.isArray(data.products)) throw new Error("no products");
  SHOP = {
    promoText: String(shop.promoText || ""),
    discountPercent: Math.min(90, Math.max(0, Number(shop.discountPercent) || 0)),
    bestSellers: Array.isArray(shop.bestSellers) ? shop.bestSellers : [],
    newCount: Number.isFinite(Number(shop.newCount)) ? Number(shop.newCount) : 8,
    shippingFee: shop.shippingFee === null || shop.shippingFee === undefined || shop.shippingFee === "" ? null : Math.max(0, Number(shop.shippingFee) || 0),
    freeShippingOver: Math.max(0, Number(shop.freeShippingOver) || 0),
    payment: {promptpayId: String((shop.payment || {}).promptpayId || ""), accountName: String((shop.payment || {}).accountName || ""), text: String((shop.payment || {}).text || "")},
    saveUrl: String(shop.saveUrl || "")
  };
  $("promo").textContent = SHOP.promoText; $("promo").hidden = !SHOP.promoText;
  PRODUCTS = buildProducts(data.products.map(r => ({...r, orig: r.price, price: linePrice(r.price)})));
  for (const p of PRODUCTS){ p.title = names[p.id] || p.name; p.search += " " + p.title.toLowerCase(); }
  bySku = new Map();
  for (const p of PRODUCTS) for (const v of p.variants) bySku.set(v.sku, {p, v});
  for (const sku of [...cart.keys()]) if (!bySku.has(sku)) cart.delete(sku);
}
const left = v => v.stock - (cart.get(v.sku) || 0);
/* ลำดับรูป: รูปใน GitHub ก่อน ถ้าไม่มีใช้รูปจาก ZORT ถ้าไม่มีอีกใช้รูปสำรอง */
const img = (srcs, alt) => { const s = srcs.filter(Boolean); return `<img src="${esc(s[0])}" data-next="${esc(s.slice(1).join("|"))}" alt="${esc(alt)}" loading="lazy">`; };
document.addEventListener("error", e => {
  const el = e.target; if (el.tagName !== "IMG") return;
  const next = (el.dataset.next || "").split("|").filter(Boolean);
  el.dataset.next = next.slice(1).join("|");
  el.src = next[0] || PLACEHOLDER;
  if (!next[0]) el.removeAttribute("data-next");
}, true);

function renderTabs(){
  const cats = ["ทั้งหมด", FAV, ...new Set(PRODUCTS.map(p => p.cat))];
  $("tabs").innerHTML = cats.map(c => `<button class="tab" type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
}
function renderGrid(){
  const q = $("q").value.trim().toLowerCase(), only = $("instock").checked;
  const list = PRODUCTS.filter(p => (cat === "ทั้งหมด" || (cat === FAV ? favs.has(p.id) : p.cat === cat)) && (!only || p.stock > 0) && (!q || p.search.includes(q)));
  const card = p => `
    <div class="cell"><button class="card${p.stock ? "" : " sold"}" type="button" data-id="${esc(p.id)}">
      <span class="pic">${img([CONFIG.IMAGE_DIR + p.id + ".jpg", p.variants[0].image], p.title)}</span>
      <span class="info">
        <span class="name">${esc(p.title)}</span>
        <span class="price">${p.orig > p.price ? `<s>${p.orig.toLocaleString("th-TH")}</s>` : ""}${p.multiPrice ? "<small>เริ่ม </small>" : ""}${baht(p.price)}</span>
        <span class="meta">${p.stock ? `เหลือ ${p.stock.toLocaleString("th-TH")} ชิ้น` : `<span class="out">สินค้าหมด</span>`}${p.variants.length > 1 ? ` · ${p.variants.length} ตัวเลือก` : ""}</span>
      </span>
    </button><button class="fav" type="button" data-fav="${esc(p.id)}" aria-pressed="${favs.has(p.id)}" aria-label="ถูกใจ">${favs.has(p.id) ? "♥" : "♡"}</button></div>`;
  const have = list.filter(p => p.stock > 0), sold = list.filter(p => !p.stock);
  let top = "";
  if (cat === "ทั้งหมด" && !q){
    const best = SHOP.bestSellers.map(id => PRODUCTS.find(p => p.id === id)).filter(p => p && p.stock > 0);
    const fresh = [...have].sort((a, b) => b.id.localeCompare(a.id)).slice(0, SHOP.newCount);
    if (best.length) top += `<h2 class="sec ok">ขายดี</h2>` + best.map(card).join("");
    if (fresh.length) top += `<h2 class="sec ok">มาใหม่</h2>` + fresh.map(card).join("");
    if (top) top += `<h2 class="sec ok">สินค้าทั้งหมด</h2>`;
  }
  $("grid").innerHTML = list.length
    ? top + have.map(card).join("") + (sold.length ? `<h2 class="sec">สินค้าหมด <small>${sold.length} รายการ</small></h2>` + sold.map(card).join("") : "")
    : `<div class="state">${cat === FAV && !q ? "ยังไม่มีสินค้าที่ถูกใจ กดรูปหัวใจบนสินค้าเพื่อเก็บไว้ดูทีหลังได้เลย" : "ไม่พบสินค้า ลองพิมพ์คำอื่นหรือเลือกหมวดอื่น"}</div>`;
}
function renderCartBar(){
  let n = 0, total = 0;
  for (const [sku, k] of cart){ n += k; total += k * bySku.get(sku).v.price; }
  $("cartbar").hidden = n === 0;
  $("openCart").textContent = `ดูตะกร้า ${n} ชิ้น · ${baht(total)}`;
}
function openSheet(html, view){ const s = $("sheet"); s.innerHTML = `<div>${html}</div>`; s.dataset.view = view; s.hidden = false; $("backdrop").hidden = false; s.scrollTop = 0; }
function closeSheet(){ $("sheet").hidden = true; $("backdrop").hidden = true; }
function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
const closeBtn = `<button class="x" type="button" data-act="close" aria-label="ปิด">✕</button>`;

function showProduct(id, sku){
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  const v = p.variants.find(x => x.sku === sku) || p.variants.find(x => left(x) > 0) || p.variants[0];
  sel = v.sku;
  const max = left(v);
  qty = Math.max(1, Math.min(qty, max));
  const options = p.variants.length > 1 ? `<div><div class="label">เลือกแบบ</div><div class="opts">${p.variants.map(o => `
      <button class="opt" type="button" data-sku="${esc(o.sku)}" aria-pressed="${o.sku === v.sku}" ${o.stock ? "" : "disabled"}>
        ${o.hex ? `<span class="dot" style="background:${o.hex}"></span>` : ""}<span>${esc(o.label)}<small>${o.stock ? `เหลือ ${o.stock.toLocaleString("th-TH")}` : "หมด"}</small></span></button>`).join("")}</div></div>` : "";
  openSheet(`
    <div class="head"><h2>${esc(p.title)}</h2>${closeBtn}</div>
    <div class="detail"><span class="pic">${img([CONFIG.IMAGE_DIR + v.sku + ".jpg", v.image, CONFIG.IMAGE_DIR + p.id + ".jpg"], p.name)}</span>
      <div><div class="price">${v.orig > v.price ? `<s>${v.orig.toLocaleString("th-TH")}</s>` : ""}${baht(v.price)}</div>
      ${v.orig > v.price ? `<div class="deal">ราคาพิเศษ LINE ลด ${SHOP.discountPercent}%</div>` : ""}
      <div>${v.stock ? `เหลือ <b>${v.stock.toLocaleString("th-TH")}</b> ชิ้น` : `<span class="out">สินค้าหมด</span>`}</div>
      <div class="sku">${esc(v.sku)}</div></div></div>
    <div class="row2">
      <button class="btn ghost" type="button" data-act="fav" aria-pressed="${favs.has(p.id)}">${favs.has(p.id) ? "♥ ถูกใจแล้ว" : "♡ ถูกใจ"}</button>
      <button class="btn ghost" type="button" data-act="share">แชร์สินค้า</button>
    </div>
    ${options}
    ${p.title !== p.name ? `<p class="desc">${esc(p.name)}</p>` : ""}
    <div><div class="label">จำนวน</div><div class="qty">
      <button type="button" data-act="minus" aria-label="ลดจำนวน" ${qty <= 1 ? "disabled" : ""}>−</button><b>${max > 0 ? qty : 0}</b>
      <button type="button" data-act="plus" aria-label="เพิ่มจำนวน" ${qty >= max ? "disabled" : ""}>+</button>
      <span class="sku">${cart.get(v.sku) ? `อยู่ในตะกร้าแล้ว ${cart.get(v.sku)} ชิ้น` : ""}</span></div></div>
    <button class="btn" type="button" data-act="add" ${max > 0 ? "" : "disabled"}>${max > 0 ? `ใส่ตะกร้า · ${baht(v.price * qty)}` : (v.stock ? "ใส่ตะกร้าครบจำนวนที่มีแล้ว" : "สินค้าหมด")}</button>`, "product");
  $("sheet").dataset.id = id;
}
function showCart(notice){
  let total = 0, n = 0;
  const lines = [...cart].map(([sku, k]) => {
    const {p, v} = bySku.get(sku); total += k * v.price; n += k;
    return `<div class="line">
      <div class="t"><b>${esc(p.title)}</b><span class="sku">${v.label ? esc(v.label) + " · " : ""}${baht(v.price)}</span></div>
      <div class="qty"><button type="button" data-act="dec" data-sku="${esc(sku)}" aria-label="ลดจำนวน">−</button><b>${k}</b>
      <button type="button" data-act="inc" data-sku="${esc(sku)}" aria-label="เพิ่มจำนวน" ${k >= v.stock ? "disabled" : ""}>+</button></div></div>`;
  }).join("");
  if (!n){ closeSheet(); renderCartBar(); if (notice) toast(notice); return; }
  openSheet(`
    <div class="head"><h2>ตะกร้าของคุณ</h2>${closeBtn}</div>
    ${notice ? `<p class="warn">${esc(notice)}</p>` : ""}
    <div>${lines}</div>
    <div class="sum"><span>รวม ${n} ชิ้น</span><span>${baht(total)}</span></div>
    <button class="btn" type="button" data-act="checkout">ดำเนินการสั่งซื้อ</button>
    <button class="btn ghost" type="button" data-act="close">เลือกสินค้าต่อ</button>`, "cart");
}
/* ---------- สรุปยอด ค่าส่ง ที่อยู่ และการชำระเงิน ---------- */
let draft = {name: "", phone: "", address: "", note: "", remember: true};
try { Object.assign(draft, JSON.parse(localStorage.getItem("ponpon-customer") || "{}")); } catch (e) {}
function totals(){
  let goods = 0, n = 0;
  for (const [sku, k] of cart){ goods += k * bySku.get(sku).v.price; n += k; }
  const ship = SHOP.shippingFee === null ? null : (SHOP.freeShippingOver > 0 && goods >= SHOP.freeShippingOver ? 0 : SHOP.shippingFee);
  return {goods, n, ship, total: goods + (ship || 0)};
}
const shipLabel = ship => ship === null ? "แอดมินแจ้งในแชต" : ship === 0 ? "ฟรี" : baht(ship);
/* สร้างข้อความ QR พร้อมเพย์ตามมาตรฐาน EMVCo (ใส่ยอดเงินได้) */
function promptpayPayload(id, amount){
  const d = String(id || "").replace(/\D/g, ""); if (![10, 13, 15].includes(d.length)) return "";
  const f = (t, v) => t + String(v.length).padStart(2, "0") + v;
  const acct = d.length === 10 ? f("01", "0066" + d.slice(1)) : d.length === 13 ? f("02", d) : f("03", d);
  const body = f("00", "01") + f("01", amount ? "12" : "11") + f("29", f("00", "A000000677010111") + acct) + f("58", "TH") + f("53", "764") + (amount ? f("54", amount.toFixed(2)) : "") + "6304";
  let crc = 0xFFFF;
  for (const ch of body){ crc ^= ch.charCodeAt(0) << 8; for (let i = 0; i < 8; i++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return body + crc.toString(16).toUpperCase().padStart(4, "0");
}
function promptpayQR(amount){
  const payload = promptpayPayload(SHOP.payment.promptpayId, amount);
  if (!payload || typeof qrcode !== "function") return "";
  try { const q = qrcode(0, "M"); q.addData(payload); q.make(); return q.createSvgTag({cellSize: 4, margin: 2, scalable: true}); } catch (e) { return ""; }
}
function showCheckout(error){
  const t = totals(); if (!t.n) return showCart();
  const pay = SHOP.payment, qr = promptpayQR(t.ship === null ? 0 : t.total);
  const payBox = qr || pay.text ? `<div class="pay"><div class="label">ช่องทางชำระเงิน</div>
      ${qr ? `<div class="qr">${qr}</div><div class="payline">สแกนจ่ายด้วยพร้อมเพย์${t.ship === null ? "" : " " + baht(t.total)}${pay.accountName ? "<br>ชื่อบัญชี " + esc(pay.accountName) : ""}</div>` : ""}
      ${pay.text ? `<p class="paytext">${esc(pay.text)}</p>` : ""}
      <p class="desc">โอนแล้วส่งสลิปในแชตได้เลยค่ะ</p></div>` : "";
  openSheet(`
    <div class="head"><h2>ที่อยู่จัดส่งและชำระเงิน</h2>${closeBtn}</div>
    ${error ? `<p class="warn">${esc(error)}</p>` : ""}
    <div class="tot">
      <div><span>ค่าสินค้า ${t.n} ชิ้น</span><span>${baht(t.goods)}</span></div>
      <div><span>ค่าจัดส่ง</span><span>${shipLabel(t.ship)}</span></div>
      <div class="sum"><span>${t.ship === null ? "ยอดสินค้า" : "ยอดชำระ"}</span><span>${baht(t.total)}</span></div>
    </div>
    <label class="fld">ชื่อผู้รับ<input id="c-name" data-f="name" autocomplete="name" value="${esc(draft.name)}"></label>
    <label class="fld">เบอร์โทร<input id="c-phone" data-f="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(draft.phone)}"></label>
    <label class="fld">ที่อยู่จัดส่ง (รวมรหัสไปรษณีย์)<textarea id="c-address" data-f="address" rows="3" autocomplete="street-address">${esc(draft.address)}</textarea></label>
    <label class="fld">หมายเหตุถึงร้าน (ไม่บังคับ)<input id="c-note" data-f="note" value="${esc(draft.note)}"></label>
    <label class="opt-row"><input type="checkbox" id="c-remember" data-f="remember" ${draft.remember ? "checked" : ""}> จำข้อมูลนี้ไว้ในเครื่องสำหรับครั้งหน้า</label>
    ${payBox}
    <button class="btn" type="button" data-act="order">ยืนยันและส่งออเดอร์</button>
    <button class="btn ghost" type="button" data-act="cart">กลับไปที่ตะกร้า</button>
    <p class="desc">ข้อมูลนี้ใช้เพื่อจัดส่งสินค้าและติดต่อเรื่องคำสั่งซื้อเท่านั้น</p>`, "checkout");
}
function checkDraft(){
  if (draft.name.trim().length < 2) return "กรอกชื่อผู้รับก่อนนะคะ";
  const d = draft.phone.replace(/\D/g, ""); if (d.length < 9 || d.length > 10) return "เบอร์โทรควรเป็นตัวเลข 9 หรือ 10 หลักค่ะ";
  if (draft.address.trim().length < 10) return "กรอกที่อยู่จัดส่งให้ครบ รวมรหัสไปรษณีย์ด้วยนะคะ";
  return "";
}
function orderItems(){
  return [...cart].map(([sku, k]) => { const {p, v} = bySku.get(sku); return {sku, name: p.title, option: v.label, qty: k, price: v.price}; });
}
function orderText(){
  const t = totals();
  const rows = orderItems().map((it, i) => {
    const nm = it.name.length > 45 ? it.name.slice(0, 45) + "…" : it.name;
    return `${i + 1}. ${nm}${it.option ? " [" + it.option + "]" : ""}\n    ${it.sku} x${it.qty} = ${baht(it.qty * it.price)}`;
  });
  const lines = ["🛒 สั่งซื้อสินค้า", ...rows, "", `ค่าสินค้า ${t.n} ชิ้น ${baht(t.goods)}`, `ค่าจัดส่ง ${shipLabel(t.ship)}`, `${t.ship === null ? "ยอดสินค้า" : "ยอดชำระ"} ${baht(t.total)}`];
  if (SHOP.discountPercent > 0) lines.push(`(ราคาพิเศษ LINE ลด ${SHOP.discountPercent}%)`);
  lines.push("", "📦 ผู้รับ", draft.name.trim(), "โทร " + draft.phone.trim(), draft.address.trim());
  if (draft.note.trim()) lines.push("หมายเหตุ: " + draft.note.trim());
  return lines.join("\n");
}
/* ส่งสำเนาออเดอร์ไปเก็บที่ระบบหลังบ้าน (ทำงานเมื่อใส่ saveUrl ใน shop.json) */
async function saveOrder(){
  if (!SHOP.saveUrl) return;
  const t = totals(), rec = {time: new Date().toISOString(), items: orderItems(), goods: t.goods, shipping: t.ship, total: t.total,
    customer: {name: draft.name.trim(), phone: draft.phone.trim(), address: draft.address.trim(), note: draft.note.trim()}, line: {}};
  try { if (CONFIG.LIFF_ID && window.liff && liff.isLoggedIn()){ const pf = await liff.getProfile(); rec.line = {userId: pf.userId, displayName: pf.displayName}; } } catch (e) {}
  try {
    await Promise.race([
      fetch(SHOP.saveUrl, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"}, body: JSON.stringify(rec)}),
      new Promise(r => setTimeout(r, 5000))
    ]);
  } catch (e) {}
}
/* เช็กสต็อกล่าสุดก่อนส่ง แล้วส่งข้อความเข้าแชตในนามลูกค้า */
async function placeOrder(){
  if (sending) return; sending = true; toast("กำลังเช็กสต็อกล่าสุด...");
  try {
    await load();
    let changed = false;
    for (const [sku, k] of [...cart]){
      const st = bySku.get(sku).v.stock;
      if (k > st){ changed = true; if (st > 0) cart.set(sku, st); else cart.delete(sku); }
    }
    saveCart(); renderGrid(); renderCartBar();
    if (changed){ sending = false; return showCart("สต็อกเพิ่งเปลี่ยน เราปรับจำนวนในตะกร้าให้ตรงกับของที่มีแล้ว ตรวจดูอีกครั้งก่อนส่งนะคะ"); }
  } catch (e) { sending = false; return showCheckout("เช็กสต็อกไม่สำเร็จ ลองกดส่งอีกครั้งนะคะ"); }
  try { if (draft.remember) localStorage.setItem("ponpon-customer", JSON.stringify(draft)); else localStorage.removeItem("ponpon-customer"); } catch (e) {}
  const text = orderText();
  await saveOrder();
  if (CONFIG.LIFF_ID && window.liff && liff.isInClient()){
    try {
      await liff.sendMessages([{type: "text", text}, {type: "text", text: CONFIG.CONFIRM_TEXT}]);
      cart.clear(); saveCart(); sending = false;
      return liff.closeWindow();
    } catch (e) {}
  }
  sending = false;
  openSheet(`
    <div class="head"><h2>ส่งข้อความนี้ให้แอดมิน</h2>${closeBtn}</div>
    <pre class="msg" id="msg">${esc(text)}</pre>
    <button class="btn" type="button" data-act="copy">คัดลอกข้อความ</button>
    <a class="btn ghost" href="https://line.me/R/ti/p/${encodeURIComponent(CONFIG.OA_ID)}">เปิดแชต PonPon แล้ววางข้อความ</a>`, "order");
}

$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; cat = b.dataset.cat; renderTabs(); renderGrid(); });
$("q").addEventListener("input", renderGrid);
$("instock").addEventListener("change", renderGrid);
$("grid").addEventListener("click", e => {
  const f = e.target.closest("[data-fav]"); if (f){ toggleFav(f.dataset.fav); return renderGrid(); }
  const c = e.target.closest(".card"); if (c){ qty = 1; return showProduct(c.dataset.id); }
  if (e.target.closest("[data-act=retry]")) start();
});
$("openCart").addEventListener("click", () => showCart());
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("sheet").addEventListener("input", e => { const f = e.target.dataset.f; if (f) draft[f] = e.target.type === "checkbox" ? e.target.checked : e.target.value; });
$("sheet").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const id = $("sheet").dataset.id, act = b.dataset.act;
  if (b.classList.contains("opt")){ qty = 1; return showProduct(id, b.dataset.sku); }
  if (act === "close") return closeSheet();
  if (act === "plus"){ qty++; return showProduct(id, sel); }
  if (act === "minus"){ qty--; return showProduct(id, sel); }
  if (act === "add"){ cart.set(sel, (cart.get(sel) || 0) + qty); qty = 1; saveCart(); closeSheet(); renderCartBar(); return toast("ใส่ตะกร้าแล้ว"); }
  if (act === "inc" || act === "dec"){
    const k = (cart.get(b.dataset.sku) || 0) + (act === "inc" ? 1 : -1);
    if (k <= 0) cart.delete(b.dataset.sku); else cart.set(b.dataset.sku, k);
    saveCart(); renderCartBar(); return showCart();
  }
  if (act === "fav"){ toggleFav(id); renderGrid(); return showProduct(id, sel); }
  if (act === "share") return shareProduct(id);
  if (act === "checkout") return showCheckout();
  if (act === "cart") return showCart();
  if (act === "order"){ const err = checkDraft(); return err ? showCheckout(err) : placeOrder(); }
  if (act === "copy"){
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("msg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("เลือกข้อความให้แล้ว กดคัดลอกได้เลย"); };
    try { navigator.clipboard.writeText(orderText()).then(() => toast("คัดลอกแล้ว"), fallback); } catch (err) { fallback(); }
  }
});

async function start(){
  $("grid").innerHTML = `<div class="state">กำลังโหลดสินค้า...</div>`;
  try { await load(); renderTabs(); renderGrid(); renderCartBar(); }
  catch (e) { $("grid").innerHTML = `<div class="state">โหลดสินค้าไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง<br><button class="btn" type="button" data-act="retry">ลองใหม่</button></div>`; }
}
/* ---------- เข้าสู่ระบบ LINE และแชร์สินค้า ---------- */
const liffReady = CONFIG.LIFF_ID && window.liff ? liff.init({liffId: CONFIG.LIFF_ID}).then(() => true).catch(() => false) : Promise.resolve(false);
async function renderUser(){
  if (!(await liffReady)) return;
  const el = $("user");
  if (liff.isLoggedIn()){
    try {
      const pf = await liff.getProfile();
      el.innerHTML = `${pf.pictureUrl ? `<img src="${esc(pf.pictureUrl)}" alt="">` : ""}<span>สวัสดีค่ะ คุณ${esc(pf.displayName)}</span>`;
      el.hidden = false;
    } catch (e) {}
  } else {
    el.innerHTML = `<button class="tab" type="button" id="login">เข้าสู่ระบบด้วย LINE</button>`;
    el.hidden = false;
    $("login").addEventListener("click", () => liff.login({redirectUri: location.href}));
  }
}
function productLink(id){
  return (CONFIG.LIFF_ID ? "https://miniapp.line.me/" + CONFIG.LIFF_ID : location.origin + location.pathname) + "?p=" + encodeURIComponent(id);
}
async function shareProduct(id){
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  const url = productLink(p.id);
  const text = `${p.title}\n${p.multiPrice ? "เริ่ม " : ""}${baht(p.price)}\n${url}`;
  if (await liffReady && liff.isLoggedIn() && liff.isApiAvailable("shareTargetPicker")){
    try { const r = await liff.shareTargetPicker([{type: "text", text}]); if (r) toast("แชร์แล้ว"); return; } catch (e) {}
  }
  try { await navigator.clipboard.writeText(url); toast("คัดลอกลิงก์สินค้าแล้ว"); }
  catch (e) { toast("คัดลอกไม่สำเร็จ ลองเปิดจากในแอป LINE นะคะ"); }
}
renderUser();
start().then(async () => {
  await liffReady;
  const id = (new URLSearchParams(location.search).get("p") || "").toUpperCase();
  if (/^[A-Z0-9]{3,20}$/.test(id) && PRODUCTS.some(p => p.id === id)){ qty = 1; showProduct(id); }
});
</script>
